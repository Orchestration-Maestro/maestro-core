[package]
name = "maestro"
description = "The command line of Maestro: collections, their imports, the jobs that run them, and the machine's setup and checks"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[features]
# The embedded graph engine, LadybugDB: `graph.engine = "lbug"` is accepted
# only in a build with it. G27 adds the engine adapter behind it.
engine = []

[dependencies]
clap.workspace = true
maestro-kernel.workspace = true
maestro-knowledge.workspace = true
maestro-settings.workspace = true
rmcp.workspace = true
rusqlite = { workspace = true, features = ["backup"] }
schemars.workspace = true
serde.workspace = true
serde_json = { workspace = true, features = ["float_roundtrip"] }
sha2.workspace = true
tokio = { workspace = true, features = [
  "io-util",
  "io-std",
  "macros",
  "rt",
  "sync",
  "time",
] }
ulid.workspace = true

[dev-dependencies]
maestro-test-scratch.workspace = true
qdrant-client.workspace = true
tonic.workspace = true
tracing.workspace = true

[target.'cfg(windows)'.dependencies]
winapi-util.workspace = true
