[package]
name = "maestro-kernel"
description = "The single authoritative store of Maestro, starting with its content-addressed artifacts"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[features]
# Deterministic connection-open instrumentation for cross-crate adapter tests.
test = ["rusqlite/trace"]

[lints]
workspace = true

[dependencies]
reqwest.workspace = true
rusqlite.workspace = true
schemars.workspace = true
serde.workspace = true
# Scores read back to the same bits, so a bundle reads back equal.
serde_json = { workspace = true, features = ["float_roundtrip"] }
sha2.workspace = true
toml.workspace = true
tracing.workspace = true
ulid.workspace = true

[target.'cfg(unix)'.dependencies]
rustix.workspace = true

[dev-dependencies]
rusqlite = { workspace = true, features = ["trace"] }
maestro-test-scratch.workspace = true
tokio = { workspace = true, features = ["macros", "rt"] }
