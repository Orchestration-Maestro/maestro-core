[package]
name = "lbug-spike"
description = "Throwaway S2 G25 probe: LadybugDB (lbug) builds, opens, writes, reads and reopens"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[features]
# Off by default: no workspace build compiles liblbug until G27 adopts it.
engine = ["dep:lbug"]

[dependencies]
lbug = { workspace = true, optional = true }

[[test]]
name = "it"
path = "tests/it/main.rs"
required-features = ["engine"]

[[example]]
name = "open_query"
required-features = ["engine"]

[[example]]
name = "open_reopen"
required-features = ["engine"]
