[package]
name = "maestro-knowledge"
description = "The knowledge pipeline of Maestro, starting with the collection and corpus contracts it imports through"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[features]
# Native projection activation is opt-in; default builds never compile liblbug.
engine = ["dep:lbug"]

[dependencies]
maestro-filesystem.workspace = true
lbug = { workspace = true, optional = true }
maestro-canonicalization.workspace = true
maestro-kernel.workspace = true
qdrant-client.workspace = true
schemars.workspace = true
serde.workspace = true
serde_json.workspace = true
sha1.workspace = true
sha2.workspace = true
tokio = { workspace = true, features = ["macros", "rt", "time"] }
uuid.workspace = true
whatlang.workspace = true

[dev-dependencies]
maestro-test-clock.workspace = true
maestro-test-scratch.workspace = true
reqwest.workspace = true
rusqlite.workspace = true
tokio = { workspace = true, features = ["macros", "rt", "test-util", "time"] }
tonic.workspace = true
tracing.workspace = true
