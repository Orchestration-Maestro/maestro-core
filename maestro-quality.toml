# The organization's quality rules as this repository shapes them: the inputs
# its CI caller passes, the seams that keep one caller, each with its reason,
# and the words it means. Read by rust-gate architecture and rust-gate sync.

# What the caller passed before its ci.yml became generated: a required
# deny.toml and artifacts named after the repository. Pedantic Clippy needs no
# input: the organization's lint block in Cargo.toml already denies the group,
# and `clippy-level: pedantic` would deny on the command line the lints the
# block allows on purpose, similar_names among them. The platforms beside
# Linux are ADR-0016's first-class targets, so the tests run on each.
[ci]
license-policy = "enforce"
artifact-key = "maestro-core"
platforms = "macos windows"
# Split mutation testing across remote runners, the count chosen from the
# mutants of the change (maestro-rust-workflows v4.4.0).
mutation-shards = 0
mutation-windows = [
  "crates/maestro-settings/src/file/windows.rs",
  "crates/maestro-canonicalization/src/filesystem/windows.rs",
]

# The seams of the canonicalization crate that keep one caller: each door is a
# subsystem, and its one outside caller is the stage that composes it.
[[exception]]
rule = "ARC-005"
path = "crates/maestro-canonicalization/src/chunk_split/mod.rs"
item = "build_drafts"
reason = "the chunker packs a mapped document through the structural splitter"

[[exception]]
rule = "ARC-005"
path = "crates/maestro-canonicalization/src/chunk_split/mod.rs"
item = "validate_preparation"
reason = "chunk replay reruns the splitter and so lives beside its rules"

[[exception]]
rule = "ARC-005"
path = "crates/maestro-canonicalization/src/chunks/mod.rs"
item = "chunk_documents"
reason = "the /4 CompleteIdeas control view reuses the existing /3 packing and verified counting path"

[[exception]]
rule = "ARC-005"
path = "crates/maestro-canonicalization/src/validate/mod.rs"
item = "validate_structure"
reason = "the pipeline runs the structural validator, a subsystem of its own"

# The platform door picks rustix on Unix or Win32's flags on Windows, so that
# neither the store nor the tokenizer branches on the platform (ADR-0018).
[[exception]]
rule = "ARC-005"
path = "crates/maestro-canonicalization/src/filesystem/mod.rs"
item = "Directory"
reason = "the store's link-free directories, one type on each platform"

[[exception]]
rule = "ARC-005"
path = "crates/maestro-canonicalization/src/filesystem/mod.rs"
item = "open_nofollow"
reason = "the artifact check's link-free open, one function on each platform"

[[exception]]
rule = "ARC-005"
path = "crates/maestro-kernel/src/job/mod.rs"
item = "NewJob"
reason = "the public job submission contract serves higher-level crates; acquisition is its sole in-crate caller"

# The journal's filter, which jobs alone use outside the journal for now, to
# read a job's last step: the lane that adds a second reader of a stream, the
# binary's job wait (T022) among them, removes it when the rule reports it
# stale.
[[exception]]
rule = "ARC-005"
path = "crates/maestro-kernel/src/journal/mod.rs"
item = "Filter"
reason = "the journal's public filter, which every reader of a stream names: jobs first, then the binary's job wait (T022)"

# The public knowledge event catalogue stays together, although a database
# writer inside the kernel emits each type.
[[exception]]
rule = "ARC-005"
path = "crates/maestro-kernel/src/journal/mod.rs"
item = "HeldDisposition"
reason = "the public knowledge event catalogue: a disposition that holds its revision journals revision.held, and other crates journal the other events"

[[exception]]
rule = "ARC-005"
path = "crates/maestro-kernel/src/journal/mod.rs"
item = "RevisionHeld"
reason = "the public knowledge event catalogue: a disposition that holds its revision journals revision.held, and other crates journal the other events"

[[exception]]
rule = "ARC-005"
path = "crates/maestro-kernel/src/journal/mod.rs"
item = "GenerationPublished"
reason = "the public knowledge event catalogue: the lifecycle writer journals each publication on its collection's stream"

[[exception]]
rule = "ARC-005"
path = "crates/maestro-kernel/src/journal/mod.rs"
item = "GenerationRetired"
reason = "the public knowledge event catalogue: the lifecycle writer journals each retirement on its collection's stream"

# Scope name rules are public: maestro-knowledge's parser applies them to
# collection and source ids, which the rule does not count, and the kernel's
# record writers apply them again. A second caller in the crate removes these,
# which the rule then reports stale.
[[exception]]
rule = "ARC-005"
path = "crates/maestro-kernel/src/scope/mod.rs"
item = "check_name"
reason = "the scope module owns the public name rule: maestro-knowledge's parser and the kernel's record writers apply it"

[[exception]]
rule = "ARC-005"
path = "crates/maestro-kernel/src/scope/mod.rs"
item = "check_collection_name"
reason = "the scope module owns the collection name rule: maestro-knowledge's declaration parser and the kernel's record writers apply it"

[[exception]]
rule = "ARC-005"
path = "crates/maestro-kernel/src/scope/mod.rs"
item = "InvalidName"
reason = "the scope module owns the public name rule: maestro-knowledge's parser and the kernel's record writers apply it"

# The scope module writes each source path in one place; kernel hold events
# and maestro-knowledge's import build it too, which the rule does not count.
[[exception]]
rule = "ARC-005"
path = "crates/maestro-kernel/src/scope/mod.rs"
item = "source_path"
reason = "the scope module writes every source's scope path: the kernel's hold events and maestro-knowledge's import build it"

# Search reads reuse the generation and chunk records as their public pinned
# identifiers; creating parallel projection-specific record types would split
# their authority.
[[exception]]
rule = "ARC-005"
path = "crates/maestro-kernel/src/generation/mod.rs"
item = "Generation"
reason = "SearchRead carries the lifecycle generation itself so every kernel search stays pinned to its authoritative collection and chunk set"

[[exception]]
rule = "ARC-005"
path = "crates/maestro-kernel/src/chunk_set/mod.rs"
item = "Chunk"
reason = "the scoped search batch reader returns the existing public chunk record rather than copying its digest, span and token count"

# TextFormat is a public member of the v2 card identity; ModelCard applies its
# literal prefix/suffix at the tokenizer boundary.
[[exception]]
rule = "ARC-005"
path = "crates/maestro-kernel/src/gateway/card_v2/mod.rs"
item = "TextFormat"
reason = "TextFormat remains part of the public v2 card identity; ModelCard applies its literal input format"

# InventoryCount is the strict wire item nested in evidence::Inventory; the
# reader builds that wire answer without a duplicate projection type.
[[exception]]
rule = "ARC-005"
path = "crates/maestro-kernel/src/evidence/mod.rs"
item = "InventoryCount"
reason = "InventoryCount is the public strict wire item nested in Inventory, which the controlled kernel reader assembles directly"

# The manifest owns duplicate/refusal mapping; publication records its exact member list.
[[exception]]
rule = "ARC-005"
path = "crates/maestro-knowledge/src/prepare/mod.rs"
item = "search_members"
reason = "manifest membership owns duplicate/refusal mapping; publication records its exact member list"

# Query understanding and inventory parsing share one exact set-filter grammar.
[[exception]]
rule = "ARC-005"
path = "crates/maestro-knowledge/src/query/mod.rs"
item = "INVENTORY_FILTERS"
reason = "understanding and inventory parsing must share suffixes to mask quoted set text consistently"

[[exception]]
rule = "ARC-005"
path = "crates/maestro-knowledge/src/query/mod.rs"
item = "INVENTORY_DOCUMENT_FORMS"
reason = "understanding and inventory parsing must share document forms to mask quoted set text consistently"

[[exception]]
rule = "ARC-005"
path = "crates/maestro-knowledge/src/query/mod.rs"
item = "INVENTORY_VERSION_FORMS"
reason = "understanding and inventory parsing must share version forms to mask quoted set text consistently"

[[exception]]
rule = "ARC-005"
path = "crates/maestro-knowledge/src/query/mod.rs"
item = "backtick_runs"
reason = "query understanding and the answer's literal check must split backtick runs the same way"

# Independent retrieval routes stay separate from orchestration and one another.
[[exception]]
rule = "ARC-005"
path = "crates/maestro-knowledge/src/search/routes/mod.rs"
item = "identifier"
reason = "the identifier route combines exact payloads and indexed scoped rows behind one route API"

[[exception]]
rule = "ARC-005"
path = "crates/maestro-knowledge/src/search/routes/mod.rs"
item = "lexical"
reason = "the lexical route remains an independent R2 implementation, invoked once by fused search"

[[exception]]
rule = "ARC-005"
path = "crates/maestro-knowledge/src/search/routes/mod.rs"
item = "structured"
reason = "the structured route owns exact Global inventories and their bounded kernel read"

[[exception]]
rule = "ARC-005"
path = "crates/maestro-knowledge/src/search/evidence/mod.rs"
item = "assemble_evidence"
reason = "public API of maestro-knowledge, called from the maestro crate; ARC-005 does not count cross-crate callers"

# The public search module keeps the shared retrieval and evidence seams
# together; standalone search and ask use the same APIs.
[[exception]]
rule = "ARC-005"
path = "crates/maestro-knowledge/src/search/mod.rs"
item = "search"
reason = "ask is its only in-crate caller; CLI, MCP and integration-test consumers are in other crates"

# The quality gate's reader of the revisions it lets through: the gate owns
# eligibility, so the preparation (T023) reads it rather than deciding again,
# and the gate's contract tests call it from outside the crate's sources.
[[exception]]
rule = "ARC-005"
path = "crates/maestro-knowledge/src/quality/mod.rs"
item = "eligible"
reason = "the quality gate owns which revisions go on: the preparation reads them through it rather than deciding again, and the gate's contract tests call it from outside the crate's sources"

# The lexical analyzer's passage side (T040), public: the index weighs a
# generation's passages through it (T026), which the rule counts, and the
# analyzer's contract tests call it from outside the crate's sources, which it
# does not; a query is weighed through query_vector instead.
[[exception]]
rule = "ARC-005"
path = "crates/maestro-knowledge/src/lexical/mod.rs"
item = "AverageLength"
reason = "the analyzer's public passage weights: the index weighs a generation's passages through them, and the analyzer's contract tests call them from outside the crate's sources"

[[exception]]
rule = "ARC-005"
path = "crates/maestro-knowledge/src/lexical/mod.rs"
item = "Passage"
reason = "the analyzer's public passage weights: the index weighs a generation's passages through them, and the analyzer's contract tests call them from outside the crate's sources"

# The second versions qdrant-client 1.19 forces (ADR-0020), each removed when
# the crates that hold it move to the version maestro-core uses: syn 2 for the
# procedural macros of its gRPC stack, base64 0.22 for tonic, and getrandom 0.2
# and windows-sys 0.52 for ring, under tonic's TLS.
[[exception]]
rule = "DEP-001"
path = "syn@2"
reason = "qdrant-client 1.19 requires it (prost-derive 0.14, derive_builder 0.20, pin-project-internal and tracing-attributes under tonic; ADR-0020); remove when they move to syn 3, the version maestro-core uses"

[[exception]]
rule = "DEP-001"
path = "base64@0.22.1"
reason = "qdrant-client 1.19 requires it (tonic 0.14; ADR-0020); remove when tonic moves to base64 0.23, the version maestro-core uses"

[[exception]]
rule = "DEP-001"
path = "getrandom@0.2.17"
reason = "qdrant-client 1.19 requires it (ring 0.17 under tonic's TLS; ADR-0020); remove when ring moves to getrandom 0.4, the version maestro-core uses"

[[exception]]
rule = "DEP-001"
path = "windows-sys@0.52.0"
reason = "qdrant-client 1.19 requires it (ring 0.17 under tonic's TLS; ADR-0020); remove when ring moves to windows-sys 0.61, the version maestro-core uses"
[[exception]]
rule = "DEP-001"
path = "hashbrown@0.15.5"
reason = "whatlang 0.18 requires it (ADR-0020); remove when whatlang moves to hashbrown 0.17"

# The MCP module owns its transport and service startup; CLI dispatch selects
# its one public protocol entry point.
[[exception]]
rule = "ARC-005"
path = "crates/maestro/src/mcp/mod.rs"
item = "run"
reason = "the MCP module owns bounded transport and server startup; the CLI dispatcher selects its single stdio entry point"

# The words this repository means that the spell checker reads as mistakes:
# Exemple, French test input for the canonicalizer; RTO, the recovery time
# objective beside RPO; WRONLY, the POSIX open flag as rustix names it;
# abandonne, exponentiel and termine, French words of the lexical sample in
# specs/001-knowledge-kernel/research.md and T040's tests of it; languag, the
# misspelled Qdrant option that research shows being silently ignored;
# adresse, amont, certificat, certificats, contracter, groupe, groupes, reste,
# responsable, ressource, restauration, seconde, sur and valide, French words
# of the synthetic collection in tests/fixtures/synthetic; celle, celles and
# toi, French stopwords of the lexical analyzer, as sur is too, and requet and
# schedul, stems its golden test pins; flate, of flate2, the compression crate
# qdrant-client's tonic brings, which supply-chain/config.toml exempts; nd,
# the ordinal ending of 2nd that the intent guard reads as a quantity.
# N09 HTTP is an admitted transport subsystem door, not capture-private code.
# N13 discovery adds its next production caller; remove when that caller lands.
[[exception]]
rule = "ARC-005"
path = "crates/maestro-acquisition/src/transport/mod.rs"
item = "http"
reason = "N09's public transport subsystem is consumed by capture and N13 discovery"

# N11 resources is the shared reservation subsystem, not a capture-only ledger.
# N40 depends on N11 and measures aggregate publication budgets; its caller is
# the next in-crate consumer. Remove when that caller lands.
[[exception]]
rule = "ARC-005"
path = "crates/maestro-acquisition/src/lifecycle/mod.rs"
item = "resources"
reason = "N11's public resource subsystem is shared by capture and N40 publication"

[typos]
words = [
  "Exemple",
  "RTO",
  "WRONLY",
  "abandonne",
  "exponentiel",
  "termine",
  "languag",
  "adresse",
  "amont",
  "certificat",
  "certificats",
  "contracter",
  "groupe",
  "groupes",
  "reste",
  "responsable",
  "ressource",
  "restauration",
  "seconde",
  "sur",
  "valide",
  "celle",
  "celles",
  "toi",
  "requet",
  "schedul",
  "flate",
  "nd",
]

[[exception]]
rule = "ARC-005"
path = "crates/maestro-kernel/src/unit_graph/mod.rs"
item = "GraphKey"
reason = "the public source-scoped graph read key belongs to graph storage; representation completion also reads each graph through this boundary"

[[exception]]
rule = "TST-001"
path = "crates/maestro-test-clock/src/stopped.rs"
item = "work_is_constructed_on_the_stopped_clock"
reason = "proves paused Tokio time ignores real time; the assertion is equality on paused time, so it is deterministic whatever the sleep length; 20 ms"

[[exception]]
rule = "ARC-005"
path = "crates/maestro-acquisition/src/extraction/mod.rs"
item = "registry"
reason = "the existing public resolve/select port stays extraction-owned; N57 is its first production consumer"
