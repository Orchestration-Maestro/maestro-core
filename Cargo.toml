[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "MIT"
publish = false

[workspace.dependencies]
# The command line's grammar, derived: clap_derive 4.6 builds on syn 3, as the
# workspace does. No colour, no suggestions: fewer crates to vet.
clap = { version = "4.6.7", default-features = false, features = [
  "derive",
  "error-context",
  "help",
  "std",
  "usage",
] }
maestro-canonicalization = { path = "crates/maestro-canonicalization", version = "0.1.0" }
maestro-kernel = { path = "crates/maestro-kernel", version = "0.1.0" }
maestro-knowledge = { path = "crates/maestro-knowledge", version = "0.1.0" }
pulldown-cmark = { version = "=0.13.4", default-features = false }
# Qdrant's official client, over gRPC (ADR-0003, ADR-0020): no snapshot
# downloads, so no second reqwest; serde for JSON payloads.
qdrant-client = { version = "1.19.0", default-features = false, features = [
  "serde",
] }
# Cargo.lock pins idna_adapter, which reqwest reaches through url, to 1.1.0 for MSRV 1.85:
# 1.2's ICU4X back end needs Rust 1.87. Restore it after an update with
# `cargo update -p idna_adapter --precise 1.1.0`; it goes when T034 raises the MSRV to 1.88.
reqwest = { version = "0.13.5", default-features = false, features = ["json"] }
rusqlite = { version = "0.40.2", default-features = false, features = [
  "bundled",
] }
rustix = { version = "=1.1.5", features = ["fs"] }
schemars = "1.2.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml_ng = "0.10"
# SHA-1 for name-based UUIDs alone (UUIDv5), beside sha2 on digest 0.11.
sha1 = "0.11.0"
sha2 = "0.11"
tokio = "1.53.1"
# The gRPC server of the tests' fake Qdrant: the version qdrant-client uses.
tonic = "0.14.6"
toml = { version = "1.1.6", default-features = false, features = [
  "parse",
  "serde",
  "std",
] }
tracing = { version = "0.1.44", default-features = false, features = ["std"] }
ulid = "3.0.0"
# UUIDs, the IDs of Qdrant points: their version 5 is built from sha1, so
# uuid's own v5 feature, and the SHA-1 crate it brings, stay out.
uuid = { version = "1.26.1", default-features = false }

# generated by rust-gate lints --write; do not edit down to the end marker
[workspace.lints]
clippy.all = { level = "deny", priority = -1 }
clippy.pedantic = { level = "deny", priority = -1 }
clippy.cargo = { level = "deny", priority = -1 }
rust.rust_2018_idioms = { level = "deny", priority = -1 }
rust.nonstandard_style = { level = "deny", priority = -1 }
clippy.allow_attributes = "deny"
clippy.allow_attributes_without_reason = "deny"
clippy.unwrap_used = "deny"
clippy.expect_used = "deny"
clippy.panic = "deny"
clippy.indexing_slicing = "deny"
clippy.unreachable = "deny"
clippy.exit = "deny"
clippy.todo = "deny"
clippy.unimplemented = "deny"
clippy.dbg_macro = "deny"
clippy.self_named_module_files = "deny"
clippy.absolute_paths = "deny"
clippy.min_ident_chars = "deny"
clippy.redundant_test_prefix = "deny"
clippy.ignore_without_reason = "deny"
clippy.should_panic_without_expect = "deny"
clippy.undocumented_unsafe_blocks = "deny"
clippy.cognitive_complexity = "deny"
clippy.excessive_nesting = "deny"
clippy.same_name_method = "deny"
rust.missing_docs = "deny"
rust.unreachable_pub = "deny"
rust.missing_debug_implementations = "deny"
rust.unused_qualifications = "deny"
rust.let_underscore_drop = "deny"
rust.redundant_lifetimes = "deny"
rust.unit_bindings = "deny"
rust.unexpected_cfgs = "deny"
clippy.multiple_crate_versions = "allow"
clippy.similar_names = "allow"
# end of the generated lints; add the repository's own below, never remove one
rust.unsafe_code = "forbid"
clippy.missing_docs_in_private_items = "deny"
clippy.too_many_lines = "deny"
clippy.too_many_arguments = "deny"
