# Mutants no test can kill, each with its reason: none changes behaviour a
# test can observe.
# Names are exact, line and column included: when code moves, the mutant comes
# back as missed and its exclusion is reviewed again (tasks.md, T019).
test_tool = "nextest"
exclude_re = [
  # The final window breaks before start can equal the nonempty span's end.
  '^crates/maestro-knowledge/src/graph/extract/windows\.rs:85:21: replace < with <= in windows$',
  # The default returns Vec::new(), exactly the same empty vector as vec![].
  '^crates/maestro-catalog/src/bootstrap/compose\.rs:55:9: replace PresetPort::absent_inputs -> Vec<\(PathBuf, String\)> with vec!\[\]$',
  # Selection or the terminal boundary stops before the extra refresh is read.
  '^crates/maestro-catalog/src/settings/discovery\.rs:184:34: replace && with \|\| in discover$',
  # Cached reads are bytes or NotFound once capture diagnostics are empty.
  '^crates/maestro-catalog/src/source/check\.rs:168:27: replace match guard error\.kind\(\) == io::ErrorKind::NotFound with true in build_snapshot$',
  # The default assets result is already an empty successful vector.
  '^crates/maestro-catalog/src/source/rules\.rs:22:9: replace KindRules::assets -> Result<Vec<String>, String> with Ok\(vec!\[\]\)$',
  # The default edges result is already an empty vector.
  '^crates/maestro-catalog/src/source/rules\.rs:27:9: replace KindRules::edges -> Vec<ResourceId> with vec!\[\]$',
  # The validated last OwnersOnly rule cannot satisfy the Content predicate.
  '^crates/maestro-catalog/src/source/ownership\.rs:361:39: replace \+ with \* in Ownership<\x27_>::check_review_rules$',
  # `<=` only adds the empty range, which holds no content: the same findings.
  '^crates/maestro-canonicalization/src/validate/structure\.rs:155:19: replace < with <= in check_uncovered$',
  '^crates/maestro-canonicalization/src/validate/structure\.rs:165:14: replace < with <= in check_gap$',
  '^crates/maestro-canonicalization/src/validate/blocks\.rs:207:23: replace < with <= in BlockCheck<.+>::container_gaps$',
  # `push` checks every unit with `mapped_slice`, which refuses the same
  # origins with the same error.
  '^crates/maestro-canonicalization/src/chunk_mapping/document\.rs:218:13: replace \|\| with && in Mapper<.+>::append$',
  # The parser never enables superscript (`^b^` stays text), and chunking
  # replays every document first, so no mapped document holds one.
  '^crates/maestro-canonicalization/src/chunk_mapping/document\.rs:259:21: delete match arm InlineKind::Superscript in Mapper<.+>::render$',
  # A directory flush only shows after a power loss: the entries are visible
  # to every reader either way. It moved from artifact/store.rs when the
  # database began creating directories too.
  '^crates/maestro-kernel/src/filesystem\.rs:66:5: replace sync_directory -> Result<\(\), E> with Ok\(\(\)\)$',
  # serde_json reads every JSON value through this visitor, so it never asks
  # what the visitor expected.
  '^crates/maestro-knowledge/src/corpus\.rs:227:9: replace <impl Visitor<.de> for ValueVisitor>::expecting -> fmt::Result with Ok\(Default::default\(\)\)$',
  # The default `Value` is `Value::Null`, the value `visit_unit` returns.
  '^crates/maestro-knowledge/src/corpus\.rs:253:9: replace <impl Visitor<.de> for ValueVisitor>::visit_unit -> Result<Value, E> with Ok\(Default::default\(\)\)$',
]
