# Mutants no test can kill, each with its reason: none changes behaviour a
# test can observe.
# Names are exact, line and column included: when code moves, the mutant comes
# back as missed and its exclusion is reviewed again (tasks.md, T019).
exclude_re = [
  # `<=` only adds the empty range, which holds no content: the same findings.
  '^crates/maestro-canonicalization/src/validate/structure\.rs:155:19: replace < with <= in check_uncovered$',
  '^crates/maestro-canonicalization/src/validate/structure\.rs:165:14: replace < with <= in check_gap$',
  '^crates/maestro-canonicalization/src/validate/blocks\.rs:207:23: replace < with <= in BlockCheck<.+>::container_gaps$',
  # `push` checks every unit with `mapped_slice`, which refuses the same
  # origins with the same error.
  '^crates/maestro-canonicalization/src/chunk_mapping/document\.rs:218:13: replace \|\| with && in Mapper<.+>::append$',
  # The parser never enables superscript (`^b^` stays text), and chunking
  # replays every document first, so no mapped document holds one.
  '^crates/maestro-canonicalization/src/chunk_mapping/document\.rs:259:21: delete match arm InlineKind::Superscript in Mapper<.+>::render$',
  # A column past the row's width also fails the rebuild, with the same error;
  # a window without columns matches no fragment.
  '^crates/maestro-canonicalization/src/chunk_split/replay\.rs:85:13: replace \|\| with && in order_windows$',
  # At `end == closing.end` the delimiter would extend `end` to itself.
  '^crates/maestro-canonicalization/src/chunk_split/prepare\.rs:224:69: replace < with <= in normalized_range$',
  # `normalized_range` refuses a range that ends where an opening delimiter
  # ends, so `>=` adds no range `>` lacks.
  '^crates/maestro-canonicalization/src/chunk_split/context\.rs:446:67: replace > with >= in Layout<.+>::fragment_parts$',
  # The key already holds the enclosing table, so bodies of two tables never
  # reach the window test.
  '^crates/maestro-canonicalization/src/chunk_split/layout\.rs:212:21: replace && with \|\| in Layout<.+>::compatible$',
  # Cut points end after a character, so none is 0: `p >= 0` equals `p > 0`.
  '^crates/maestro-canonicalization/src/chunk_split/layout\.rs:333:34: replace > with >= in Layout<.+>::split_unit$',
  # The whitespace cut is used only when `length` is none, so `p <= length`
  # yields the cut `p < length` yields.
  '^crates/maestro-canonicalization/src/chunk_split/layout\.rs:333:45: replace < with <= in Layout<.+>::split_unit$',
]
