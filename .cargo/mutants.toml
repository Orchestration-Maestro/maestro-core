# Mutants no test can kill, each with its reason: none changes behaviour a
# test can observe.
# Names are exact, line and column included: when code moves, the mutant comes
# back as missed and its exclusion is reviewed again (tasks.md, T019).
exclude_re = [
  # Compiled only for Windows, the one file named whole: the Linux mutation run
  # builds none of it, so no test there can see its mutants. The Windows CI leg
  # runs its tests (ADR-0018).
  '^crates/maestro-canonicalization/src/filesystem/windows\.rs:',
  # OFlags and Mode bits are disjoint, so `a ^ b` equals `a | b`.
  '^crates/maestro-canonicalization/src/filesystem/unix\.rs:87:32: replace \| with \^ in open_child$',
  '^crates/maestro-canonicalization/src/filesystem/unix\.rs:87:52: replace \| with \^ in open_child$',
  '^crates/maestro-canonicalization/src/filesystem/unix\.rs:87:71: replace \| with \^ in open_child$',
  '^crates/maestro-canonicalization/src/filesystem/unix\.rs:44:28: replace \| with \^ in Directory::read_regular$',
  '^crates/maestro-canonicalization/src/filesystem/unix\.rs:44:47: replace \| with \^ in Directory::read_regular$',
  '^crates/maestro-canonicalization/src/filesystem/unix\.rs:44:66: replace \| with \^ in Directory::read_regular$',
  '^crates/maestro-canonicalization/src/filesystem/unix\.rs:61:28: replace \| with \^ in Directory::create_new$',
  '^crates/maestro-canonicalization/src/filesystem/unix\.rs:61:45: replace \| with \^ in Directory::create_new$',
  '^crates/maestro-canonicalization/src/filesystem/unix\.rs:61:60: replace \| with \^ in Directory::create_new$',
  '^crates/maestro-canonicalization/src/filesystem/unix\.rs:61:79: replace \| with \^ in Directory::create_new$',
  '^crates/maestro-canonicalization/src/filesystem/unix\.rs:62:24: replace \| with \^ in Directory::create_new$',
  '^crates/maestro-canonicalization/src/filesystem/unix\.rs:107:24: replace \| with \^ in open_nofollow$',
  '^crates/maestro-canonicalization/src/filesystem/unix\.rs:107:42: replace \| with \^ in open_nofollow$',
  '^crates/maestro-canonicalization/src/filesystem/unix\.rs:107:61: replace \| with \^ in open_nofollow$',
  # `& O_CLOEXEC` drops O_NOFOLLOW, which O_CREAT | O_EXCL already implies for
  # the new pending file, and O_CLOEXEC, which only a child process started
  # while the file is open could observe.
  '^crates/maestro-canonicalization/src/filesystem/unix\.rs:61:79: replace \| with & in Directory::create_new$',
  # `RDONLY & CLOEXEC` is 0 on Linux: it drops O_CLOEXEC only, which only a
  # child process started while the artifact is open could observe.
  '^crates/maestro-canonicalization/src/filesystem/unix\.rs:107:24: replace \| with & in open_nofollow$',
  # `<=` only adds the empty range, which holds no content: the same findings.
  '^crates/maestro-canonicalization/src/validate/structure\.rs:155:19: replace < with <= in check_uncovered$',
  '^crates/maestro-canonicalization/src/validate/structure\.rs:165:14: replace < with <= in check_gap$',
  '^crates/maestro-canonicalization/src/validate/blocks\.rs:207:23: replace < with <= in BlockCheck<.+>::container_gaps$',
  # `push` checks every unit with `mapped_slice`, which refuses the same
  # origins with the same error.
  '^crates/maestro-canonicalization/src/chunk_mapping/document\.rs:218:13: replace \|\| with && in Mapper<.+>::append$',
  # The parser never enables superscript (`^b^` stays text), and chunking
  # replays every document first, so no mapped document holds one.
  '^crates/maestro-canonicalization/src/chunk_mapping/document\.rs:259:21: delete match arm InlineKind::Superscript in Mapper<.+>::render$',
  # A column past the row's width also fails the rebuild, with the same error;
  # a window without columns matches no fragment.
  '^crates/maestro-canonicalization/src/chunk_split/replay\.rs:85:13: replace \|\| with && in order_windows$',
  # At `end == closing.end` the delimiter would extend `end` to itself.
  '^crates/maestro-canonicalization/src/chunk_split/prepare\.rs:224:69: replace < with <= in normalized_range$',
  # `normalized_range` refuses a range that ends where an opening delimiter
  # ends, so `>=` adds no range `>` lacks.
  '^crates/maestro-canonicalization/src/chunk_split/context\.rs:446:67: replace > with >= in Layout<.+>::fragment_parts$',
  # The key already holds the enclosing table, so bodies of two tables never
  # reach the window test.
  '^crates/maestro-canonicalization/src/chunk_split/layout\.rs:212:21: replace && with \|\| in Layout<.+>::compatible$',
  # Cut points end after a character, so none is 0: `p >= 0` equals `p > 0`.
  '^crates/maestro-canonicalization/src/chunk_split/layout\.rs:336:34: replace > with >= in Layout<.+>::split_unit$',
  # The whitespace cut is used only when `length` is none, so `p <= length`
  # yields the cut `p < length` yields.
  '^crates/maestro-canonicalization/src/chunk_split/layout\.rs:336:45: replace < with <= in Layout<.+>::split_unit$',
  # A directory flush only shows after a power loss: the entries are visible
  # to every reader either way. It moved from artifact/store.rs when the
  # database began creating directories too.
  '^crates/maestro-kernel/src/filesystem\.rs:66:5: replace sync_directory -> Result<\(\), E> with Ok\(\(\)\)$',
  # serde_json reads every JSON value through this visitor, so it never asks
  # what the visitor expected.
  '^crates/maestro-knowledge/src/corpus\.rs:226:9: replace <impl Visitor<.de> for ValueVisitor>::expecting -> fmt::Result with Ok\(Default::default\(\)\)$',
  # The default `Value` is `Value::Null`, the value `visit_unit` returns.
  '^crates/maestro-knowledge/src/corpus\.rs:252:9: replace <impl Visitor<.de> for ValueVisitor>::visit_unit -> Result<Value, E> with Ok\(Default::default\(\)\)$',
]
