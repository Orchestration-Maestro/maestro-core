name: Qdrant integration
# The tests of the Qdrant projection (T026) against a real Qdrant 1.19, which
# the organization's CI cannot give them: a reusable workflow takes no service
# container (plan R6). The image is pinned by digest, each action by commit.
"on":
  pull_request:
  merge_group:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
# A newer push to the same pull request supersedes the run in flight; other
# runs finish.
concurrency:
  group: qdrant-integration-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  qdrant:
    name: Qdrant projection against Qdrant 1.19
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    services:
      qdrant:
        # qdrant/qdrant:v1.19.1, its multi-platform index.
        image: qdrant/qdrant@sha256:12364fe851b9f17356fc88189fc06d1b521262e04659ec7345975b00c9246a10
        env:
          QDRANT__TELEMETRY_DISABLED: "true"
        # REST, which the readiness check asks, and gRPC, which the tests use.
        ports:
          - 6333:6333
          - 6334:6334
    env:
      MAESTRO_QDRANT_URL: http://127.0.0.1:6334
    steps:
      - name: Check out the revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Install the toolchain rust-toolchain.toml pins
        run: |
          set -euo pipefail
          toolchain=$(sed -n 's/^channel = "\(.*\)"$/\1/p' rust-toolchain.toml)
          rustup toolchain install "$toolchain" --profile minimal
          echo "RUSTUP_TOOLCHAIN=$toolchain" >> "$GITHUB_ENV"
      - name: Wait for Qdrant to be ready
        run: |
          set -euo pipefail
          for _ in $(seq 60); do
            if curl --silent --fail http://127.0.0.1:6333/readyz; then
              exit 0
            fi
            sleep 1
          done
          echo "::error::Qdrant was not ready within 60 s"
          exit 1
      - name: Test the projection against Qdrant
        run: cargo test --locked -p maestro-knowledge --test it qdrant_projection
